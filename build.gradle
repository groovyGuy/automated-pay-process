plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.process'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// Use Java 24 for compilation and runtime testing
		languageVersion = JavaLanguageVersion.of(24)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// TODO Add these back
	// TODO implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// TODO implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Lombok for compile-time codegen; pick a modern version compatible with recent JDKs
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

// Ensure javac --release 24 so bytecode targets Java 24
tasks.withType(JavaCompile).configureEach {
	options.release.set(24)
}

// Tests may require additional JVM args for module openness; adjust as needed
test {
	useJUnitPlatform()
}
